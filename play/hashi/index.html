<style>
/* The game is drawn for a phone, and Godot takes the shape of the window it is
   handed. Given a desktop window it stretches into a letterbox and crops its
   own background away - the spheres and bridges live at the top and bottom of
   a 3:4 image, and covering a wide rect throws both ends out.

   The iframe is what fixes it rather than CSS alone: inside a frame, the
   engine's window IS this box, so the canvas it sizes itself to is already
   portrait. Nothing has to override Godot, which is why this holds. */
:root{
	--tomb:#1a1712;
	--tomb-deep:#12100c;
	--gold:#d4af37;
	--dim:#a2957a;
	--vh:100vh;
	--chrome:0px;
}
@supports (height:100dvh){ :root{ --vh:100dvh; } }
@media (min-width:700px) and (min-height:560px){ :root{ --chrome:68px; } }

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
	margin:0;
	background:radial-gradient(1200px 600px at 50% -10%, #241f17 0%, var(--tomb) 45%, var(--tomb-deep) 100%);
	color:var(--dim);
	font-family:Georgia,"Times New Roman",serif;
	overflow:hidden;
	touch-action:none;
	display:flex;
	flex-direction:column;
	align-items:center;
	justify-content:center;
	gap:14px;
}
#frame{
	--avail:calc(var(--vh) - var(--chrome));
	width:min(100vw, calc(var(--avail) * 9 / 19.5));
	height:min(var(--avail), calc(100vw * 19.5 / 9));
	border:0;
	display:block;
	background:#0b1b33;
}
#note{
	display:none;
	margin:0;
	font-size:14px;
	letter-spacing:.02em;
}
#note a{
	color:var(--gold);
	text-decoration:none;
	border-bottom:1px solid rgba(212,175,55,.22);
}
#note a:hover{ border-bottom-color:var(--gold); }

/* The store link is the point of this page, so it is a button and the other
   two stay links. Same treatment as the itch build. */
#note a.store{
	display:inline-block;
	background:var(--gold); color:#12100c;
	border:0; border-radius:999px;
	padding:7px 16px; margin:0 4px;
	font-weight:700; letter-spacing:.02em;
	line-height:1.3; vertical-align:middle;
}
#note a.store:hover{ filter:brightness(1.08); border:0; }

/* The home-screen offer stands right next to the store button, so it is the
   same object: same pill, same height, same type, outlined instead of filled
   so the store still leads. This page carries its own stylesheet and never
   loads /style.css, which is how this button spent its first day here
   rendering as the browser's default grey box beside a gold one. */
#note button.cta{
	cursor:pointer;
	display:inline-block;
	vertical-align:middle;
	background:transparent;
	color:var(--gold);
	border:1px solid rgba(212,175,55,.55);
	border-radius:999px;
	/* One pixel less top and bottom than the filled button, because this one
	   carries a border and the two have to end up the same height. */
	padding:6px 16px; margin:0 4px;
	font-family:inherit; font-size:14px;
	font-weight:700; letter-spacing:.02em;
	line-height:1.3;
}
#note button.cta:hover{ border-color:var(--gold); background:rgba(212,175,55,.1); }
@media (min-width:700px) and (min-height:560px){
	#frame{
		border-radius:18px;
		box-shadow:0 0 0 1px rgba(212,175,55,.22), 0 30px 80px rgba(0,0,0,.6);
	}
	#note{ display:block; }
}
</style>

<!-- Installable. The manifest points at THIS page rather than at the engine's
     own export, so adding it to a home screen gets the portrait frame, the
     store link and the measurement, not a bare canvas. The service worker is
     here because a browser will not offer the install without one; it caches
     nothing, and sw.js says why at length. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12100c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hashi">
<link rel="apple-touch-icon" href="/assets/hashi-icon-192.png">

<!-- Measurement. Consent defaults to denied inside this file; see the
     privacy policy for what it records. -->
<script src="/assets/analytics.js" defer></script>
<!-- Offers the home screen, once, after the visit has earned it. -->
<script src="/assets/install.js"></script>
</head>
<body>
<iframe id="frame" title="Hashi: Bridges" allow="autoplay; fullscreen"></iframe>
<script>
/* A link may name a level: ?level=medium-24. The engine inside the frame can
   only read its own URL, so the parameter is copied onto the frame's src here.
   Nothing else is forwarded: the utm fields belong to this page and are read
   from here.

   The iframe is given no src in the markup on purpose. Setting it afterwards
   on an iframe that already has one starts a second load, and the build it
   would abandon is nine megabytes of wasm. */
(function () {
	var f = document.getElementById("frame");
	if (!f) { return; }
	var m = location.search.match(/[?&]level=([A-Za-z]+-[0-9]+)(?:&|$)/);
	f.src = "game/" + (m ? "?level=" + encodeURIComponent(m[1]) : "");
})();
</script>
<p id="note">Hashi is made for a phone, so it plays as one here. &middot; <button type="button" class="cta secondary" data-install hidden>Add to home screen</button> &middot; <a class="store" href="https://play.google.com/store/apps/details?id=com.anubisproductions.hashi&amp;referrer=utm_source%3Danubis-site%26utm_medium%3Dweb%26utm_campaign%3Dweb-build">Get it on Google Play</a> &middot; <a href="../../hashi/how-to-play.html">How to play</a> &middot; <a href="../../">Anubis Productions</a></p>
</body>
